<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}কাঠের হিসাব{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark topbar">
<div class="container"><a class="navbar-brand fw-bold" href="/">🪵 কাঠের হিসাব</a>
<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
<div class="collapse navbar-collapse" id="nav">
<div class="navbar-nav ms-auto">
<a class="nav-link" href="/">ড্যাশবোর্ড</a><a class="nav-link" href="/customers/">কাস্টমার</a>
<a class="nav-link" href="/sales/add/">বিক্রি যোগ</a><a class="nav-link" href="/payments/add/">টাকা জমা</a>
<a class="nav-link" href="/stock/">স্টক</a><a class="nav-link" href="/reports/">রিপোর্ট</a>
{% if user.is_superuser %}<a class="nav-link" href="/backup/">ব্যাকআপ</a>{% endif %}
{% if user.is_authenticated %}<form method="post" action="/accounts/logout/" class="d-inline">{% csrf_token %}<button class="btn btn-sm btn-outline-light mt-1">লগআউট</button></form>{% endif %}
</div></div></div></nav>
<main class="container py-4">
{% for message in messages %}<div class="alert alert-success">{{ message }}</div>{% endfor %}
{% block content %}{% endblock %}
</main>
<footer class="text-center text-muted py-4 small">কাঠের হিসাব · ব্যবসার হিসাব সহজ রাখুন</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
